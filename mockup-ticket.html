<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massive Nights — tickets</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #1c1c1c; color: #f4efe6; font-family: Palatino, "Iowan Old Style", Georgia, serif; }
  .page { width: min(860px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
  h1 { font-family: Impact, Haettenschweiler, "Arial Narrow", sans-serif; font-weight: 400; font-size: 3.4rem; letter-spacing: 0.03em; text-transform: uppercase; margin: 0; line-height: 0.9; }
  .lede { margin: 8px 0 0; font-style: italic; color: #f0c93a; }
  nav { display: flex; gap: 1.4rem; margin-top: 20px; }
  nav button { font: inherit; font-size: 1.05rem; background: none; border: 0; border-bottom: 2px solid transparent; color: #9a9386; cursor: pointer; padding: 0 0 4px; }
  nav button[aria-current="page"] { color: #f4efe6; border-bottom-color: #e23b2f; }
  .filters { display: flex; gap: 1rem; margin: 18px 0 8px; }
  .filters button, .back { font: inherit; background: none; border: 0; color: #9a9386; cursor: pointer; padding: 0; }
  .filters button[aria-pressed="true"], .back { color: #f0c93a; }
  .ticket { display: grid; grid-template-columns: 118px 18px 1fr; background: #f7f1e6; color: #1a1814; margin: 14px 0; }
  .stub { background: #1e3f73; color: #fff8ee; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 6px; }
  .stub.concert { background: #1e3f73; }
  .stub.comedy { background: #c47b2b; }
  .stub.sports { background: #e23b2f; }
  .stub .mon { font-family: Impact, sans-serif; letter-spacing: 0.14em; font-size: 0.95rem; }
  .stub .day { font-family: Impact, sans-serif; font-size: 3.1rem; line-height: 0.85; }
  .stub .year { font-size: 0.85rem; letter-spacing: 0.08em; }
  .perf { background: repeating-linear-gradient(#1a1814 0 6px, transparent 6px 12px); width: 18px; }
  .body { padding: 12px 16px 12px 14px; display: flex; align-items: center; gap: 14px; }
  .admit { font-family: Impact, sans-serif; letter-spacing: 0.18em; font-size: 0.78rem; color: #e23b2f; }
  .body h2 { font-size: 1.35rem; margin: 2px 0 0; line-height: 1.05; }
  .venue { margin: 2px 0 0; }
  .copy { flex: 1; min-width: 0; }
  .seat { display: flex; gap: 14px; padding-top: 10px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
  .seat b { display: block; font-size: 0.68rem; letter-spacing: 0.08em; font-weight: 600; }
  .face { flex: none; display: block; width: auto; height: auto; max-width: 178px; max-height: 127px; }
  .face.portrait { max-width: 116px; max-height: 156px; }
  .row { display: flex; gap: 14px; align-items: center; }
  .venue-btn { width: 100%; text-align: left; font: inherit; font-size: 1.45rem; background: #f7f1e6; color: #1a1814; border: 0; padding: 16px 18px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; }
  .venue-btn span { font-family: Impact, sans-serif; color: #e23b2f; }
  .empty { color: #9a9386; }
</style>
</head>
<body>
<div class="page">
  <h1>Massive Nights</h1>
  <p class="lede">Our Psalms Are Sing-Along Songs</p>
  <nav>
    <button type="button" id="tab-shows" aria-current="page">Shows</button>
    <button type="button" id="tab-artists">Artists</button>
    <button type="button" id="tab-venues">Venues</button>
  </nav>
  <div class="filters" id="filters">
    <button type="button" data-type="all" aria-pressed="true">All</button>
    <button type="button" data-type="concert">Concerts</button>
    <button type="button" data-type="comedy">Comedy</button>
    <button type="button" data-type="sports">Sports</button>
  </div>
  <div id="list"></div>
</div>
<script>
const SHOWS = [
  { artist: "An Evening With Band of Horses", venue: "The Van Buren", city: "Phoenix", mon: "NOV", day: "16", year: "2026", type: "concert", sec: "—", row: "—", seat: "—", img: "images/band-of-horses.jpg", extra: "Upcoming" },
  { artist: "Jack White", venue: "Arizona Financial Theatre", city: "Phoenix", mon: "OCT", day: "03", year: "2026", type: "concert", sec: "—", row: "—", seat: "—", img: "images/jack-white.jpg", extra: "" },
  { artist: "Nate Bargatze", venue: "PHX Arena", city: "Phoenix", mon: "JUN", day: "27", year: "2026", type: "comedy", sec: "104", row: "15", seat: "1-2", img: "images/nate-bargatze.jpg", extra: "" },
  { artist: "Georgia v TCU", venue: "SoFi Stadium", city: "Inglewood", mon: "JAN", day: "09", year: "2023", type: "sports", sec: "418", row: "2", seat: "23-24", img: "images/georgia.png", extra: "National championship" },
  { artist: "The National", venue: "Fox Theatre", city: "Atlanta", mon: "OCT", day: "05", year: "2010", type: "concert", sec: "—", row: "—", seat: "—", img: "images/the-national.jpg", extra: "Owen Pallett opened" },
  { artist: "Kenny Chesney", venue: "40 Watt Club", city: "Athens", mon: "JAN", day: "24", year: "2004", type: "concert", sec: "—", row: "—", seat: "—", img: "", extra: "Uncle Kracker opened" }
];
const PEOPLE = [["Band of Horses", 6], ["Jack White", 2], ["Nate Bargatze", 1], ["The National", 3], ["Kenny Chesney", 1], ["Uncle Kracker", 1]];
let mode = "shows", kind = "all", venue = "";

function ticket(s) {
  const face = s.img ? `<img class="face" src="${s.img}" alt="" onload="this.classList.toggle('portrait', this.naturalHeight>this.naturalWidth)">` : "";
  return `<article class="ticket">
    <div class="stub ${s.type}"><div class="mon">${s.mon}</div><div class="day">${s.day}</div><div class="year">${s.year}</div></div>
    <div class="perf" aria-hidden="true"></div>
    <div class="body">
      <div class="copy">
        <div class="admit">ADMIT ONE</div>
        <h2>${s.artist}</h2>
        <p class="venue">${s.venue} · ${s.city}</p>
        ${s.extra ? `<p class="venue">${s.extra}</p>` : ""}
        <div class="seat"><span><b>SEC</b>${s.sec}</span><span><b>ROW</b>${s.row}</span><span><b>SEAT</b>${s.seat}</span></div>
      </div>
      ${face}
    </div>
  </article>`;
}
function render() {
  const list = document.getElementById("list");
  document.getElementById("filters").hidden = mode !== "shows";
  if (mode === "venues" && !venue) {
    const counts = {};
    SHOWS.forEach(s => { counts[s.venue] = (counts[s.venue] || 0) + 1; });
    list.innerHTML = Object.entries(counts).map(([name, n]) => `<button class="venue-btn" type="button" data-venue="${name}">${name}<span>${n}</span></button>`).join("");
    return;
  }
  if (mode === "artists") {
    list.innerHTML = PEOPLE.map(([name, n]) => `<article class="ticket"><div class="stub"><div class="day">${n}</div><div class="year">NIGHTS</div></div><div class="perf"></div><div class="body"><div class="admit">ARTIST</div><h2>${name}</h2></div></article>`).join("");
    return;
  }
  const rows = SHOWS.filter(s => (kind === "all" || s.type === kind) && (!venue || s.venue === venue));
  const back = venue ? `<button class="back" type="button" id="back">All venues</button>` : "";
  list.innerHTML = back + (rows.map(ticket).join("") || `<p class="empty">No tickets in this sample.</p>`);
  const b = document.getElementById("back");
  if (b) b.addEventListener("click", () => { venue = ""; render(); });
}
document.getElementById("list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-venue]");
  if (!btn) return;
  venue = btn.dataset.venue;
  render();
});
document.querySelectorAll(".filters button").forEach(btn => btn.addEventListener("click", () => {
  kind = btn.dataset.type;
  document.querySelectorAll(".filters button").forEach(el => el.setAttribute("aria-pressed", el === btn ? "true" : "false"));
  render();
}));
function tab(name) {
  mode = name;
  if (name !== "venues") venue = "";
  ["shows", "artists", "venues"].forEach(id => {
    const el = document.getElementById("tab-" + id);
    if (id === name) el.setAttribute("aria-current", "page");
    else el.removeAttribute("aria-current");
  });
  render();
}
document.getElementById("tab-shows").addEventListener("click", () => tab("shows"));
document.getElementById("tab-artists").addEventListener("click", () => tab("artists"));
document.getElementById("tab-venues").addEventListener("click", () => tab("venues"));
render();
</script>
</body>
</html>
