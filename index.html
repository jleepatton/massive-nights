function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function seatParts(raw) {
  const s = (raw || "").trim();
  if (!s) return null;
  const sec = s.match(/(?:sec(?:tion)?|orch(?:estra)?)\s*([A-Z0-9-]+)/i);
  const row = s.match(/row\s*([A-Z0-9-]+)/i);
  const seat = s.match(/seats?\s*([A-Z0-9][A-Z0-9,\- ]*)/i);
  if (!sec && !row && !seat) return { raw: s };
  return { sec: sec ? sec[1] : "—", row: row ? row[1] : "—", seat: seat ? seat[1].trim() : "—" };
}
function stubDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return {
    mon: d.toLocaleString("en-US", { month: "short" }).toUpperCase(),
    day: String(d.getDate()).padStart(2, "0"),
    year: String(d.getFullYear())
  };
}

  if (view === "venues") { applyPane("venues"); renderVenues(); return; }
  const act = params.get("act") || "";
  const q = params.get("q") || "";
  state.act = act && ROSTER.some(r => r.name === act) ? act : "";
  state.q = state.act || q;
  document.getElementById("q").value = state.q;
  applyPane("shows");
  render();
}

["all", "concert", "comedy", "sports", "other"].forEach(value => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.value = value;
  b.textContent = value === "all" ? "All" : value[0].toUpperCase() + value.slice(1);
  b.setAttribute("aria-pressed", value === "all" ? "true" : "false");
  b.addEventListener("click", () => {
    state.category = value;
    setPressed("types", value);
    render();
  });
  document.getElementById("types").append(b);
});
const years = [...new Set(SHOWS.map(s => s.event_date.slice(0, 4)))].sort((a, b) => b - a);
yearSel.innerHTML = `<option value="all">All dates</option>` + years.map(y => `<option value="${y}">${y}</option>`).join("");
yearSel.addEventListener("change", () => { state.year = yearSel.value; render(); });
statusSel.innerHTML = ["all", "upcoming", "past", "transferred", "cancelled"].map(s => `<option value="${s}">${s === "all" ? "Any status" : s[0].toUpperCase() + s.slice(1)}</option>`).join("");
statusSel.addEventListener("change", () => { state.status = statusSel.value; render(); });
document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value.trim();
  if (state.act && state.q !== state.act) state.act = "";
  render();
});
document.getElementById("sort").addEventListener("click", e => {
  state.newest = !state.newest;
  e.target.textContent = state.newest ? "Newest" : "Oldest";
  render();
});
document.getElementById("missing").addEventListener("click", e => {
  state.missing = !state.missing;
  e.target.setAttribute("aria-pressed", state.missing ? "true" : "false");
  render();
});
document.getElementById("tab-shows").addEventListener("click", openShows);
document.getElementById("tab-artists").addEventListener("click", openArtists);
document.getElementById("tab-venues").addEventListener("click", openVenues);
document.getElementById("artist-q").addEventListener("input", renderRoster);
document.getElementById("venue-q").addEventListener("input", renderVenues);
document.getElementById("roster").addEventListener("click", e => {
  const a = e.target.closest("a.poster");
  if (!a) return;
  e.preventDefault();
  openAct(a.querySelector(".name").textContent);
});
document.getElementById("venues").addEventListener("click", e => {
  const btn = e.target.closest("button.poster");
  if (!btn) return;
  state.venue = btn.dataset.venue;
  applyPane("shows");
  render();
  window.scrollTo(0, 0);
});
window.addEventListener("popstate", readUrl);
readUrl();
</script>
</body>
</html>
