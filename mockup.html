<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massive Nights — sample</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3efe6;
    --ink: #1a1814;
    --muted: #6b645b;
    --rule: #cfc6b8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 18px;
    line-height: 1.3;
  }
  .page { width: min(820px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 80px; }
  h1 { font-size: 3rem; font-weight: 500; margin: 0; letter-spacing: -0.03em; }
  .lede { margin: 8px 0 0; font-style: italic; }
  nav.views { display: flex; gap: 1.4rem; margin: 28px 0 0; }
  nav.views button {
    font: inherit;
    font-size: 1.05rem;
    background: none;
    border: 0;
    padding: 0 0 6px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  nav.views button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.1rem;
    align-items: baseline;
    margin-top: 26px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--ink);
  }
  .bar button, .bar input {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    cursor: pointer;
  }
  .bar button[aria-pressed="true"] { color: var(--ink); }
  .bar input {
    cursor: text;
    min-width: 12rem;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
  }
  .bar input:focus { outline: none; border-bottom-color: var(--ink); }
  .bar .gap { margin-left: auto; }
  #types { display: inline-flex; gap: 1.1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th {
    text-align: left;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 10px 8px 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  td { vertical-align: middle; padding: 11px 12px 11px 0; border-bottom: 1px solid var(--rule); }
  td.when { width: 7.2rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.who { font-weight: 600; }
  td.where { color: var(--ink); }
  td.seat { color: var(--muted); white-space: nowrap; text-align: right; padding-right: 0; }
  .sleeve {
    width: 46px;
    height: 46px;
    object-fit: cover;
    display: block;
    background: #e7e1d6;
  }
  .sleeve.mark {
    display: grid;
    place-items: center;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .year td {
    padding-top: 22px;
    border-bottom: 0;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .note { display: block; font-weight: 400; font-style: italic; color: var(--muted); margin-top: 2px; }
  .people { margin-top: 18px; }
  .person {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    color: inherit;
    text-decoration: none;
  }
  .person .n { font-variant-numeric: tabular-nums; color: var(--muted); }
  .letter { margin: 18px 0 0; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; }
  @media (max-width: 680px) {
    td.seat, th.seat { display: none; }
    .bar .gap { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>Massive Nights</h1>
  <p class="lede">Our Psalms Are Sing-Along Songs</p>
  <nav class="views">
    <button type="button" id="tab-shows" aria-current="page">Shows</button>
    <button type="button" id="tab-artists">Artists / teams</button>
  </nav>

  <div id="shows">
    <div class="bar">
      <input id="q" type="search" placeholder="Find a night" aria-label="Search shows">
      <span id="types"></span>
      <button class="gap" id="sort" type="button">Newest</button>
    </div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Date</th>
          <th>Who</th>
          <th>Where</th>
          <th class="seat">Seat</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <div id="artists" class="people" hidden></div>
</div>
<script>
const SHOWS = [
  { artist: "An Evening With Band of Horses", date: "2026-11-16", when: "Nov 16", year: "2026", venue: "The Van Buren", seat: "—", type: "concert", img: "images/band-of-horses.jpg", note: "Upcoming" },
  { artist: "Jack White", date: "2026-10-03", when: "Oct 3", year: "2026", venue: "Arizona Financial Theatre", seat: "—", type: "concert", img: "images/jack-white.jpg", note: "" },
  { artist: "Nate Bargatze", date: "2026-06-27", when: "Jun 27", year: "2026", venue: "PHX Arena", seat: "Sec 104, Row 15", type: "comedy", img: "images/nate-bargatze.jpg", note: "" },
  { artist: "Georgia v TCU", date: "2023-01-09", when: "Jan 9", year: "2023", venue: "SoFi Stadium", seat: "Sec 418, Row 2", type: "sports", img: "images/georgia.png", note: "National championship" },
  { artist: "The National", date: "2010-10-05", when: "Oct 5", year: "2010", venue: "Fox Theatre", seat: "—", type: "concert", img: "images/the-national.jpg", note: "Owen Pallett opened" },
  { artist: "Kenny Chesney", date: "2004-01-24", when: "Jan 24", year: "2004", venue: "40 Watt Club, Athens", seat: "—", type: "concert", img: "", note: "Uncle Kracker opened" }
];
const PEOPLE = [
  ["Band of Horses", 6, "images/band-of-horses.jpg"],
  ["Georgia", 3, "images/georgia.png"],
  ["Jack White", 2, "images/jack-white.jpg"],
  ["Kenny Chesney", 1, ""],
  ["Luke Bryan", 5, "images/luke-bryan.jpg"],
  ["Nate Bargatze", 1, "images/nate-bargatze.jpg"],
  ["The National", 3, "images/the-national.jpg"],
  ["Uncle Kracker", 1, ""]
];
const state = { q: "", type: "all", newest: true };

function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function matches(s) {
  if (state.type !== "all" && s.type !== state.type) return false;
  if (!state.q) return true;
  return norm([s.artist, s.venue, s.seat, s.note].join(" ")).includes(norm(state.q));
}
function mark(name) {
  const parts = name.replace(/^the\s+/i, "").split(/\s+/).filter(Boolean);
  return parts.slice(0, 2).map(w => w[0]).join("").toUpperCase();
}
function sleeve(src, name) {
  if (src) return `<img class="sleeve" src="${src}" alt="">`;
  return `<span class="sleeve mark">${mark(name)}</span>`;
}

function render() {
  const rows = SHOWS.filter(matches).sort((a, b) => state.newest ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  const body = document.getElementById("list");
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5"><p class="empty">Nothing in this sample.</p></td></tr>`;
    return;
  }
  let html = "";
  let year = "";
  rows.forEach(s => {
    if (s.year !== year) {
      year = s.year;
      html += `<tr class="year"><td colspan="5">${year}</td></tr>`;
    }
    const who = s.note ? `${s.artist}<span class="note">${s.note}</span>` : s.artist;
    html += `<tr>
      <td>${sleeve(s.img, s.artist)}</td>
      <td class="when">${s.when}</td>
      <td class="who">${who}</td>
      <td class="where">${s.venue}</td>
      <td class="seat">${s.seat}</td>
    </tr>`;
  });
  body.innerHTML = html;
}

function renderPeople() {
  const groups = {};
  PEOPLE.forEach(p => {
    const letter = p[0].replace(/^the\s+/i, "")[0].toUpperCase();
    (groups[letter] ||= []).push(p);
  });
  document.getElementById("artists").innerHTML = Object.keys(groups).sort().map(letter => {
    const rows = groups[letter].map(([name, n, img]) =>
      `<a class="person" href="#" data-name="${name}">${sleeve(img, name)}<span>${name}</span><span class="n">${n}</span></a>`
    ).join("");
    return `<h2 class="letter">${letter}</h2>${rows}`;
  }).join("");
}

function types() {
  const box = document.getElementById("types");
  [["all", "All"], ["concert", "Concerts"], ["comedy", "Comedy"], ["sports", "Sports"]].forEach(([value, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", value === "all" ? "true" : "false");
    b.addEventListener("click", () => {
      state.type = value;
      [...box.children].forEach(el => el.setAttribute("aria-pressed", el === b ? "true" : "false"));
      render();
    });
    box.append(b);
  });
}
types();
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("sort").addEventListener("click", e => {
  state.newest = !state.newest;
  e.target.textContent = state.newest ? "Newest" : "Oldest";
  render();
});
function pane(which) {
  const artists = which === "artists";
  document.getElementById("shows").hidden = artists;
  document.getElementById("artists").hidden = !artists;
  document.getElementById("tab-shows").toggleAttribute("aria-current", !artists);
  document.getElementById("tab-artists").toggleAttribute("aria-current", artists);
  if (!artists) document.getElementById("tab-shows").setAttribute("aria-current", "page");
  else document.getElementById("tab-shows").removeAttribute("aria-current");
  if (artists) document.getElementById("tab-artists").setAttribute("aria-current", "page");
  else document.getElementById("tab-artists").removeAttribute("aria-current");
}
document.getElementById("tab-shows").addEventListener("click", () => pane("shows"));
document.getElementById("tab-artists").addEventListener("click", () => pane("artists"));
document.getElementById("artists").addEventListener("click", e => {
  const a = e.target.closest("a.person");
  if (!a) return;
  e.preventDefault();
  document.getElementById("q").value = a.dataset.name;
  state.q = a.dataset.name;
  state.type = "all";
  [...document.getElementById("types").children].forEach((el, i) => el.setAttribute("aria-pressed", i === 0 ? "true" : "false"));
  pane("shows");
  render();
});
render();
renderPeople();
</script>
</body>
</html>
